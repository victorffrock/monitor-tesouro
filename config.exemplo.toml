# Fonte dos dados e preferências básicas do Monitor Tesouro.

[fonte]
url = "https://www.tesourotransparente.gov.br/ckan/dataset/df56aa42-484a-4a59-8184-7676580c81e3/resource/796d2059-14e9-44e3-80c9-2d9e30b405c1/download/precotaxatesourodireto.csv"
timeout_segundos = 45

[armazenamento]
diretorio = "~/.local/share/monitor-tesouro"

[alertas]
patamares_pct = [7.0, 8.0, 9.0, 10.0]

[notificacoes.desktop]
habilitado = true
comando = ["notify-send", "--app-name=Monitor Tesouro"]

[resumo]
habilitado = false
vencimentos = [2029, 2035, 2045]
