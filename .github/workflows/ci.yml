name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint and build package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install project and pinned quality tools
        run: python -m pip install --disable-pip-version-check '.[dev]'
      - name: Lint
        run: ruff check --select E4,E7,E9,F src tests
      - name: Build source and wheel distributions
        run: python -m build
      - name: Install wheel and smoke-test CLI
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/monitor-tesouro-install" dist/*.whl
          PYTHONPATH="$RUNNER_TEMP/monitor-tesouro-install" python -c "import monitor_tesouro.core"
          PYTHONPATH="$RUNNER_TEMP/monitor-tesouro-install" "$RUNNER_TEMP/monitor-tesouro-install/bin/monitor-tesouro" --help

  tests:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Check syntax
        run: python -m compileall -q src tests
