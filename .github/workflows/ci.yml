name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint and build package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install project and pinned quality tools
        run: python -m pip install --disable-pip-version-check '.[dev]'
      - name: Lint
        run: ruff check --select E4,E7,E9,F src tests
      - name: Build source and wheel distributions
        run: python -m build
      - name: Install wheel and smoke-test CLI
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/monitor-tesouro-install" dist/*.whl
          PYTHONPATH="$RUNNER_TEMP/monitor-tesouro-install" python -c "import monitor_tesouro.core"
          PYTHONPATH="$RUNNER_TEMP/monitor-tesouro-install" "$RUNNER_TEMP/monitor-tesouro-install/bin/monitor-tesouro" --help

  tests:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Check syntax
        run: python -m compileall -q src tests

  gtk-smoke:
    name: GTK 4 and libadwaita runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install native GTK runtime
        run: sudo apt-get update && sudo apt-get install --yes python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb
      - name: Import interface and verify GTK versions
        env:
          PYTHONPATH: src
        run: xvfb-run -a /usr/bin/python3 -c "import gi; gi.require_version('Gtk', '4.0'); gi.require_version('Adw', '1'); from gi.repository import Gtk, Adw; import monitor_tesouro.gui; print(Gtk.get_major_version(), Adw.get_major_version())"
