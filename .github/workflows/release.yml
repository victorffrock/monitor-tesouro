name: Build and publish AppImage

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Build x86_64 AppImage and zsync metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 python3-tk libtcl8.6 libtk8.6 libxss1 libzstd1 librsvg2-bin zsync squashfs-tools file curl ca-certificates
      - name: Run tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Build AppImage
        run: packaging/build_appimage.sh
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - name: Upload artifacts to the published GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "dist/Monitor-Tesouro-x86_64.AppImage" \
            "dist/Monitor-Tesouro-x86_64.AppImage.zsync" \
            "dist/Monitor-Tesouro-sem-fuse.sh" \
            --clobber
