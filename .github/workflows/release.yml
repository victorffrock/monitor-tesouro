name: Build and publish AppImage

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Build x86_64 AppImage and zsync metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 libgtk-4-1 libadwaita-1-0 libzstd1 librsvg2-bin zsync squashfs-tools file curl ca-certificates
      - name: Run tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Build AppImage
        run: packaging/build_appimage.sh
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - name: Upload artifacts to the published GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "dist/Monitor-Tesouro-x86_64.AppImage" \
            "dist/Monitor-Tesouro-x86_64.AppImage.zsync" \
            "dist/Monitor-Tesouro-sem-fuse.sh" \
            --clobber
